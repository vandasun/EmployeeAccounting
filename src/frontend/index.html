<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Учет сотрудников</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="container">
        <h1>Учет сотрудников</h1>
        
        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Поиск по ФИО...">
                <button class="btn btn-primary" id="searchBtn">Найти</button>
            </div>
            
            <div class="filters">
                <select id="departmentFilter">
                    <option value="">Все отделы</option>
                </select>
                
                <select id="positionFilter">
                    <option value="">Все должности</option>
                </select>
                
                <select id="statusFilter">
                    <option value="all">Все сотрудники</option>
                    <option value="active">Работающие</option>
                    <option value="fired">Уволенные</option>
                </select>
            </div>

            <button class="btn" id="resetBtn">Сброс</button>
            <button class="btn btn-primary" id="addBtn">+ Добавить</button>

        </div>

        <table id="employeesTable">
            <thead>
                <tr>
                    <th>ФИО</th>
                    <th>Дата рожд.</th>
                    <th>Паспорт</th>
                    <th>Телефон</th>
                    <th>Отдел</th>
                    <th>Должность</th>
                    <th>Зарплата</th>
                    <th>Дата приема</th>
                    <th>Статус</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="10" style="text-align: center;">Загрузка...</td></tr>
            </tbody>
        </table>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Добавить сотрудника</h2>
                <span class="close">&times;</span>
            </div>
            
            <form id="employeeForm">
                <input type="hidden" id="employeeId">
                
                <div class="form-group">
                    <label>Фамилия *</label>
                    <input type="text" id="lastName" required>
                </div>
                
                <div class="form-group">
                    <label>Имя *</label>
                    <input type="text" id="firstName" required>
                </div>
                
                <div class="form-group">
                    <label>Отчество</label>
                    <input type="text" id="patronymic">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Дата рождения</label>
                        <input type="date" id="birthDate">
                    </div>
                    
                    <div class="form-group">
                        <label>Дата приема *</label>
                        <input type="date" id="hireDate" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Серия паспорта</label>
                        <input type="text" id="passportSeries" maxlength="4">
                    </div>
                    
                    <div class="form-group">
                        <label>Номер паспорта</label>
                        <input type="text" id="passportNumber" maxlength="6">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Телефон</label>
                    <input type="text" id="phoneNumber" placeholder="+7 (999) 123-45-67">
                </div>
                
                <div class="form-group">
                    <label>Отдел</label>
                    <select id="departmentSelect"></select>
                </div>
                
                <div class="form-group">
                    <label>Должность</label>
                    <select id="positionSelect"></select>
                </div>
                
                <div class="form-group">
                    <label>Зарплата</label>
                    <input type="number" id="salary" step="1000">
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                    <button type="button" class="btn" id="cancelBtn">Отмена</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
